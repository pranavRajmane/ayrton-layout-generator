[project]
name = "ayrton-gating"
version = "0.0.1"
description = "Gating-design CAD module for Ayrton: element framework, regeneration, solver bridge"
requires-python = ">=3.11,<3.14"
dependencies = [
    "build123d>=0.13",
    "numpy",
    "scipy",
    "jsonschema",
    "jsonpatch",
    "shapely>=2",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["core*", "elements*", "calculators*", "rules*", "bridge*", "api*", "seeds*", "layouts*"]

[tool.setuptools.package-data]
core = ["schema/*.json"]
seeds = ["knobs.json"]
layouts = ["schema/*.json", "settings.json", "recipe_keys.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long runs (Phase 1 convergence); run with -m slow"]
addopts = "-m 'not slow'"
